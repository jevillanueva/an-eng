version: 2
models:
  - name: stg_customers
    columns:
      - name: customer_id
        description: "The unique identifier for a customer"
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "The name of the customer"
        tests:
          - not_null
      - name: country
        tests:
          - accepted_values:
              values: ["USA", "UK", "INDIA"]